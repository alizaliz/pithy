# Seeds for pithy, the daily aphorism.
# Edit freely: add sentiments and sources, change weights, then commit.

[schedule]
# Decides the date and the am/pm slot of each entry (two a day).
timezone = "Pacific/Auckland"
# Chance (0–1) that a day draws from config/baked_quotes.json instead of a source.
baked_probability = 0.2
# Don't reuse the same sentiment or source within this many entries.
avoid_recent = 6

[selection]
# Aphorisms are short: lines longer than this are never offered to the curator.
max_chars = 200
max_words = 35

# ── Sentiments ───────────────────────────────────────────────
# `description` is what the curator model reads, so make it specific.

[[sentiments]]
name = "Motivational"
description = "Encourages effort, courage or perseverance without being saccharine."
weight = 1

[[sentiments]]
name = "Piques interest"
description = "A surprising, paradoxical or thought-provoking idea that makes you stop and think."
weight = 1

[[sentiments]]
name = "Political"
description = "About power, the state, freedom or society. Historical and philosophical, not partisan or about current events."
weight = 0.5

[[sentiments]]
name = "Melancholic"
description = "Quietly sad or wistful; about time, loss or impermanence."
weight = 0.5

[[sentiments]]
name = "Wry"
description = "Dry, knowing humour that lands a real truth; witty without being a joke."
weight = 0.75

[[sentiments]]
name = "Tender"
description = "Warm and gentle; about love, kindness, memory or connection between people."
weight = 0.5

[[sentiments]]
name = "Wonder"
description = "Awe at the universe, nature and discovery; the curiosity that drives science."
weight = 0.75

[[sentiments]]
name = "Philosophical"
description = "About the nature of reality, mind, truth or how to live; contemplative rather than practical."
weight = 0.75

[[sentiments]]
name = "Martial Arts"
description = "The martial way: discipline, focus, conviction and mastery of the self, as in martial arts films and teachings."
weight = 0.25

# ── Sources ──────────────────────────────────────────────────
# `wikiquote` is the exact page title on en.wikiquote.org.
# `work` is optional: set it when the source is a single book/film.
# `section` is optional: only use quotes under the level-3 heading containing it
# (e.g. one book on an author's page).
# `kind = "film"` for film pages: also uses one-line dialogue and drops stage
# directions. Credit films to the director, with the film as `work`.
# `kind = "proverbs"` for anonymous proverb pages; `author` is then shown as-is
# (e.g. "English proverb"). Use English-language proverb pages: lines in other
# scripts are skipped.

# Aphorists: people who wrote in aphorisms, so nearly every line qualifies.

[[sources]]
author = "François de La Rochefoucauld"
work = "Maxims"
wikiquote = "François de La Rochefoucauld"
weight = 1.5

[[sources]]
author = "Georg Christoph Lichtenberg"
wikiquote = "Georg Christoph Lichtenberg"
weight = 1.5

