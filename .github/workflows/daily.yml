name: pithy

on:
  schedule:
    - cron: "7 0,12 * * *"   # every 12 hours: one am and one pm entry in Pacific/Auckland
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate the current entry even if it exists"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pithy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      # Pushes to main only redeploy; scheduled and manual runs make the entry.
      - name: Generate the current entry
        if: github.event_name != 'push'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m generator $FORCE

      - name: Commit entry
        if: github.event_name != 'push'
        run: |
          git add site
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Entry for $(python -c 'import json; print(json.load(open("site/data/latest.json"))["id"])')"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
